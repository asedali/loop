# Fly.io app config for LaunchLoop MVP.
# Replace `app` with a unique name before first deploy (fly.io will suggest one too).
app = "launchloop-mvp"
primary_region = "iad"  # change to whichever region is closest to you/your friends

[build]

[env]
  LAUNCHLOOP_DB_PATH = "/data/launchloop.db"

[[mounts]]
  source = "launchloop_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep the machine warm; SQLite + auto-stop can lose the mount's cache briefly on cold start
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
