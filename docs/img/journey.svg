<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 980" width="1060" height="980" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">
  <title id="t">The whole journey, screen by screen</title>
  <desc id="d">A vertical map of every screen in LaunchLoop with its URL and what happens there. Sign up leads to the dashboard, which branches to the new-idea page and the idea cards. Selecting a card opens the Phase 2 venture page, where the loop of design, offline work, logging and scoring repeats until blocks resolve. Failed critical blocks offer kill or pivot. Reached caps offer three more runs or park-with-a-note. Parked blocks can be re-opened free. When all nine blocks are passed or parked, the same URL renders Phase 3 with the canvas, the known gaps and a regenerable go-to-market package.</desc>
  <style>
    .bg{fill:#ffffff}
    .pnl{fill:#f5f8fc;stroke:#dde3ee;stroke-width:1}
    .pnl2{fill:#ffffff;stroke:#dde3ee;stroke-width:1}
    .ink{fill:#101827}.ink2{fill:#3b475a}.ink3{fill:#67748a}
    .t1{fill:#0284c7}.t2{fill:#7c3aed}.t3{fill:#047857}.dk{fill:#e11d48}.ok{fill:#047857}
    .mute{fill:#64748b}
    .f1{fill:#0284c7;fill-opacity:.08}.f2{fill:#7c3aed;fill-opacity:.09}
    .f3{fill:#047857;fill-opacity:.09}.fd{fill:#e11d48;fill-opacity:.08}
    .fw{fill:#a16207;fill-opacity:.11}
    .sp{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 4}
    .sp2{stroke:#7c3aed;stroke-width:1.6;stroke-dasharray:5 4}
    .caps{letter-spacing:.09em;font-size:10.5px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#080a0f}
      .pnl{fill:#10141c;stroke:#232b3a}
      .pnl2{fill:#161b25;stroke:#232b3a}
      .ink{fill:#eef2f9}.ink2{fill:#c2cbd9}.ink3{fill:#8593a8}
      .t1{fill:#38bdf8}.t2{fill:#a78bfa}.t3{fill:#34d399}.dk{fill:#fb7185}.ok{fill:#34d399}
      .mute{fill:#64748b}
      .f1{fill:#38bdf8;fill-opacity:.12}.f2{fill:#a78bfa;fill-opacity:.13}
      .f3{fill:#34d399;fill-opacity:.13}.fd{fill:#fb7185;fill-opacity:.12}
      .fw{fill:#fbbf24;fill-opacity:.12}
      .sp{stroke:#2b3648}.sp2{stroke:#a78bfa}
    }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 .6 L7.4 4 L0 7.4 z" fill="#94a3b8"/></marker>
    <marker id="g2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 .6 L7.4 4 L0 7.4 z" fill="#7c3aed"/></marker>
    <marker id="g3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 .6 L7.4 4 L0 7.4 z" fill="#047857"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1060" height="980"/>
  <text class="ink" x="32" y="40" font-size="21" font-weight="700">The whole journey, screen by screen</text>
  <text class="ink3" x="32" y="62" font-size="13">Nine screens, two AI-call phases, and three ways out of Phase 2 that are not “done”.</text>

  <!-- spine -->
  <path class="sp" d="M300 130 V930"/>

  <!-- ===== auth ===== -->
  <rect class="pnl2" x="248" y="84" width="104" height="46" rx="11"/>
  <text class="ink" x="300" y="104" text-anchor="middle" font-size="12.5" font-weight="700">/signup</text>
  <text class="mute" x="300" y="121" text-anchor="middle" font-size="11">or /login</text>
  <text class="ink3" x="372" y="112" font-size="12">bcrypt + a signed cookie. Throttled after 8 failures in 15 minutes.</text>

  <!-- dashboard -->
  <rect class="pnl" x="248" y="146" width="104" height="46" rx="11"/>
  <text class="ink" x="300" y="166" text-anchor="middle" font-size="12.5" font-weight="700">/dashboard</text>
  <text class="mute" x="300" y="183" text-anchor="middle" font-size="11">the hub</text>
  <text class="ink3" x="372" y="164" font-size="12">Your ventures · candidate ideas · <tspan class="ink2">quota used / limit</tspan></text>
  <text class="ink3" x="372" y="182" font-size="12">The empty state explains the next step rather than just saying “nothing here”.</text>

  <!-- branch to new idea -->
  <path class="sp" d="M300 192 V212 H132" fill="none" marker-end="url(#g)"/>
  <!-- branch to venture list -->
  <path class="sp" d="M300 192 V212 H132" fill="none"/>
  <rect class="f1" x="32" y="196" width="200" height="66" rx="11"/>
  <text class="t1" x="48" y="218" font-size="12.5" font-weight="700">/phase1/new</text>
  <text class="ink3" x="48" y="236" font-size="11.5">paste-text only — no upload,</text>
  <text class="ink3" x="48" y="251" font-size="11.5">no URL import</text>

  <rect class="f2" x="252" y="212" width="200" height="66" rx="11"/>
  <text class="t2" x="268" y="234" font-size="12.5" font-weight="700">/phase1/ideas</text>
  <text class="ink3" x="268" y="252" font-size="11.5">3–6 cards ·  <tspan class="ink2">1 AI call</tspan>  ·  redirected,</text>
  <text class="ink3" x="268" y="267" font-size="11.5">so a refresh never re-extracts</text>

  <!-- extract -->
  <path class="sp" d="M132 262 V292" fill="none" marker-end="url(#g)"/>
  <rect class="pnl2" x="32" y="296" width="200" height="60" rx="11"/>
  <text class="ink2" x="48" y="318" font-size="12.5" font-weight="700">POST /phase1/extract</text>
  <text class="ink3" x="48" y="336" font-size="11.5">validate → quota check → call</text>
  <text class="ink3" x="48" y="351" font-size="11.5">→ validate output → write rows</text>

  <!-- select -->
  <path class="sp" d="M352 278 V316" fill="none" marker-end="url(#g)"/>
  <rect class="pnl2" x="252" y="320" width="200" height="60" rx="11"/>
  <text class="ink2" x="268" y="342" font-size="12.5" font-weight="700">POST …/select/{id}</text>
  <text class="ink3" x="268" y="360" font-size="11.5">idea marked selected</text>
  <text class="ink3" x="268" y="375" font-size="11.5">venture + nine blocks created</text>

  <!-- into phase 2 -->
  <path class="sp2" d="M452 350 H500 V360 H560" fill="none" marker-end="url(#g2)"/>

  <!-- ===== PHASE 2 ===== -->
  <rect class="f2" x="564" y="196" width="464" height="500" rx="14"/>
  <text class="t2 caps" x="584" y="220">PHASE 2 · /venture/{id}</text>

  <rect class="pnl2" x="584" y="234" width="424" height="70" rx="10"/>
  <text class="ink" x="600" y="256" font-size="13" font-weight="700">01 · the open block</text>
  <text class="ink3" x="600" y="274" font-size="11.5">hypothesis, then “Design the first run”.</text>
  <text class="ink3" x="600" y="290" font-size="11.5">One panel only — it is always at the top.</text>

  <rect class="pnl2" x="584" y="316" width="424" height="70" rx="10"/>
  <text class="ink" x="600" y="338" font-size="13" font-weight="700">02 · the nine-block board</text>
  <text class="ink3" x="600" y="356" font-size="11.5">severity, outcome and runs-used per block.</text>
  <text class="ink3" x="600" y="372" font-size="11.5">Every row is clickable.</text>

  <rect class="pnl2" x="584" y="398" width="424" height="70" rx="10"/>
  <text class="ink" x="600" y="420" font-size="13" font-weight="700">03 · the canvas</text>
  <text class="ink3" x="600" y="438" font-size="11.5">The real Osterwalder grid, every cell live.</text>
  <text class="ink3" x="600" y="454" font-size="11.5">Nothing is “untracked” any more.</text>

  <rect class="pnl2" x="584" y="480" width="424" height="70" rx="10"/>
  <text class="ink" x="600" y="502" font-size="13" font-weight="700">04 · all runs</text>
  <text class="ink3" x="600" y="520" font-size="11.5">Every run across the venture, tagged with</text>
  <text class="ink3" x="600" y="536" font-size="11.5">its block and verdict.</text>

  <!-- the loop -->
  <path class="sp2" d="M884 380 H944 Q960 380 960 396 V560 Q960 576 944 576 H676 Q660 576 660 560 V500" fill="none"/>
  <text class="t2" x="972" y="470" font-size="11.5" font-weight="600">repeat</text>

  <rect class="f2" x="584" y="586" width="424" height="92" rx="10"/>
  <text class="t2" x="600" y="608" font-size="11.5" font-weight="700">THE LOOP, UNTIL A BLOCK RESOLVES</text>
  <text class="ink3" x="600" y="628" font-size="11.5">design <tspan class="ink2">1 AI call</tspan> → work offline → log → score <tspan class="ink2">1 AI call</tspan></text>
  <text class="ink3" x="600" y="646" font-size="11.5">3 runs per block, then a forced decision.</text>
  <text class="ink3" x="600" y="664" font-size="11.5">≈54 calls for a full nine-block validation.</text>

  <!-- ===== three exits, on the left ===== -->
  <text class="mute caps" x="32" y="404">THREE WAYS OUT</text>

  <!-- exit 1: cap -->
  <rect class="fw" x="32" y="416" width="212" height="92" rx="11"/>
  <text class="ink" x="48" y="438" font-size="12.5" font-weight="700">out of runs</text>
  <text class="ink3" x="48" y="456" font-size="11">+3 more runs, or park it</text>
  <text class="ink3" x="48" y="472" font-size="11">with a note. Parking counts</text>
  <text class="ink3" x="48" y="488" font-size="11">as resolved.</text>
  <text class="mute" x="48" y="503" font-size="10.5">one block only — not the venture</text>

  <!-- exit 2: critical fail -->
  <rect class="fd" x="32" y="520" width="212" height="92" rx="11"/>
  <text class="dk" x="48" y="542" font-size="12.5" font-weight="700">critical block fails</text>
  <text class="ink3" x="48" y="560" font-size="11">kill — the idea returns to</text>
  <text class="ink3" x="48" y="576" font-size="11">your candidates</text>
  <text class="ink3" x="48" y="594" font-size="11">or pivot — passed blocks</text>
  <text class="ink3" x="48" y="608" font-size="11">carry into a new venture</text>

  <!-- exit 3: park -->
  <rect class="fw" x="32" y="624" width="212" height="72" rx="11"/>
  <text class="ink" x="48" y="646" font-size="12.5" font-weight="700">park any block</text>
  <text class="ink3" x="48" y="664" font-size="11">the note becomes a documented</text>
  <text class="ink3" x="48" y="680" font-size="11">gap in the launch plan</text>
  <path class="sp" d="M244 660 H400 Q416 660 416 644 V600" fill="none" marker-end="url(#g)"/>

  <!-- re-open -->
  <rect class="pnl2" x="32" y="708" width="212" height="76" rx="11"/>
  <text class="ink2" x="48" y="730" font-size="12.5" font-weight="700">re-open a parked block</text>
  <text class="ink3" x="48" y="748" font-size="11">free, no AI call, cap</text>
  <text class="ink3" x="48" y="764" font-size="11">count preserved</text>
  <text class="mute" x="48" y="780" font-size="10.5">available at any time</text>
  <path class="sp" d="M244 746 H400 Q416 746 416 730 V682" fill="none" marker-end="url(#g)"/>

  <!-- ===== into phase 3 ===== -->
  <path class="sp" d="M796 700 V740" fill="none" marker-end="url(#g3)"/>
  <text class="t3" x="808" y="726" font-size="11.5" font-weight="600">all nine passed or parked</text>

  <!-- ===== PHASE 3 ===== -->
  <rect class="f3" x="564" y="748" width="464" height="182" rx="14"/>
  <text class="t3 caps" x="584" y="772">PHASE 3 · the same URL, a different template</text>

  <rect class="pnl2" x="584" y="786" width="424" height="42" rx="9"/>
  <text class="ink" x="600" y="804" font-size="12.5" font-weight="700">the canvas, unchanged</text>
  <text class="ink3" x="600" y="820" font-size="11">so you can see the evidence behind the plan</text>

  <rect class="fw" x="584" y="836" width="424" height="42" rx="9"/>
  <text class="ink" x="600" y="854" font-size="12.5" font-weight="700">known gaps in this model</text>
  <text class="ink3" x="600" y="870" font-size="11">each parked block and its workaround, if any</text>

  <rect class="pnl2" x="584" y="886" width="424" height="30" rx="9"/>
  <text class="t3" x="600" y="905" font-size="12.5" font-weight="700">Generate launch strategy →</text>
  <text class="mute" x="900" y="905" font-size="11">1 AI call</text>

  <!-- phase 3 output -->
  <rect class="pnl" x="32" y="806" width="212" height="124" rx="12"/>
  <text class="mute caps" x="48" y="828">THE PACKAGE</text>
  <text class="ink2" x="48" y="850" font-size="12">funding categories</text>
  <text class="ink2" x="48" y="868" font-size="12">GTM channels</text>
  <text class="ink2" x="48" y="886" font-size="12">sequenced action plan</text>
  <text class="dk" x="48" y="906" font-size="10.5" font-weight="600">advisory — verify every item</text>
  <text class="ink3" x="48" y="922" font-size="10.5">no invented deadlines or amounts</text>

  <text class="ink3" x="32" y="962" font-size="11.5">Regenerating keeps every earlier draft: each generation is a new row, so nothing is overwritten.</text>
</svg>