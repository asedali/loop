# Vercel. Redundant — app/main.py is already in the documented entrypoint list —
# but explicit, so a root-level main.py added later cannot silently win.
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
# Without this, bare `pytest` cannot import the app package and you have to
# remember `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]