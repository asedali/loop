[pytest]
# This used to live in pyproject.toml as [tool.pytest.ini_options]. It moved here
# because the mere presence of pyproject.toml makes Vercel prefer it over
# requirements.txt as the dependency source, and then run `uv lock` — which needs
# a PEP 621 [project] table this repo has no reason to maintain. With the file
# gone, Vercel installs from requirements.txt, which is also what the Dockerfile
# uses, so dependencies have exactly one source.
#
# Without pythonpath, bare `pytest` cannot import the app package and you have
# to remember `python -m pytest`.
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:starlette.*