<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LaunchLoop{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a class="brand" href="/">LaunchLoop</a>
    <div class="links">
      {% if user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/phase1/new">New Idea</a>
        <a href="/logout">Log out ({{ user.email }})</a>
      {% else %}
        <a href="/login">Log in</a>
        <a href="/signup">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
