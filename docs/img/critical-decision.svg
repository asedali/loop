<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">
  <title id="t">The failed-critical-block moment and the pivot</title>
  <desc id="d">A critical canvas block has come back disconfirmed. The model marks it failed and stops there. The user is shown the reasoning and given two explicit exits with no default selected. Killing returns the idea to the candidate list. Pivoting creates a new idea card and a sibling venture with a fresh nine-block canvas, and every block that was already passed carries across with its evidence, while pending and failed blocks start fresh. A note explains that a pivot changes one hypothesis, not the eight already proved, and that re-testing them would throw away real work and spend dozens of AI calls relearning it.</desc>
  <style>
    .bg{fill:#ffffff}
    .pnl{fill:#f5f8fc;stroke:#dde3ee;stroke-width:1}
    .pnl2{fill:#ffffff;stroke:#dde3ee;stroke-width:1}
    .card{fill:#fff8f9;stroke:#e11d48;stroke-width:1.2}
    .ink{fill:#101827}.ink2{fill:#3b475a}.ink3{fill:#67748a}
    .t2{fill:#7c3aed}.t3{fill:#047857}.dk{fill:#e11d48}.ok{fill:#047857}.mute{fill:#64748b}
    .fd{fill:#e11d48;fill-opacity:.08}.f2{fill:#7c3aed;fill-opacity:.09}
    .f3{fill:#047857;fill-opacity:.09}.fo{fill:#047857;fill-opacity:.16}
    .sk{fill:#e2e8f0}.skd{fill:#fecdd3}
    .std{stroke:#e11d48}.st2{stroke:#7c3aed}.st3{stroke:#047857}.st{stroke:#94a3b8}
    .p1{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
    .caps{letter-spacing:.09em;font-size:10.5px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#080a0f}
      .pnl{fill:#10141c;stroke:#232b3a}
      .pnl2{fill:#161b25;stroke:#232b3a}
      .card{fill:#1c1119;stroke:#fb7185}
      .ink{fill:#eef2f9}.ink2{fill:#c2cbd9}.ink3{fill:#8593a8}
      .t2{fill:#a78bfa}.t3{fill:#34d399}.dk{fill:#fb7185}.ok{fill:#34d399}.mute{fill:#64748b}
      .fd{fill:#fb7185;fill-opacity:.12}.f2{fill:#a78bfa;fill-opacity:.13}
      .f3{fill:#34d399;fill-opacity:.13}.fo{fill:#34d399;fill-opacity:.20}
      .sk{fill:#1c2230}.skd{fill:#4c1d2b}
      .std{stroke:#fb7185}.st2{stroke:#a78bfa}.st3{stroke:#34d399}.st{stroke:#64748b}
      .p1{fill:#161b25;stroke:#2b3648}
    }
  </style>
  <defs>
    <marker id="dd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 .6 L7.4 4 L0 7.4 z" fill="#e11d48"/></marker>
    <marker id="d2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 .6 L7.4 4 L0 7.4 z" fill="#7c3aed"/></marker>
    <marker id="d3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 .6 L7.4 4 L0 7.4 z" fill="#047857"/></marker>
    <marker id="ds" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 .6 L7.4 4 L0 7.4 z" fill="#94a3b8"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="620"/>
  <text class="ink" x="32" y="40" font-size="21" font-weight="700">The most important screen in the app</text>
  <text class="ink3" x="32" y="62" font-size="13">A critical block came back disconfirmed. Here is exactly who is allowed to decide what happens next.</text>

  <!-- ======== the trigger ======== -->
  <rect class="pnl" x="32" y="92" width="250" height="128" rx="14"/>
  <rect class="fd" x="32" y="92" width="5" height="128" rx="2.5"/>
  <text class="mute caps" x="52" y="118">THE TRIGGER</text>
  <rect class="p1" x="52" y="132" width="70" height="20" rx="10"/>
  <text class="dk" x="87" y="146" text-anchor="middle" font-size="10.5" font-weight="700">failed</text>
  <rect class="p1" x="128" y="132" width="82" height="20" rx="10"/>
  <text class="ink2" x="169" y="146" text-anchor="middle" font-size="10.5" font-weight="700">critical</text>
  <text class="ink" x="52" y="172" font-size="13" font-weight="600">Customer Segments</text>
  <text class="ink3" x="52" y="194" font-size="11.5">one of the four blocks where a</text>
  <text class="ink3" x="52" y="210" font-size="11.5">“no” puts the venture in trouble.</text>

  <path class="std" d="M286 156 H330" fill="none" stroke-width="1.8" marker-end="url(#dd)"/>
  <text class="dk" x="308" y="146" text-anchor="middle" font-size="10.5" font-weight="700">stops here</text>

  <!-- ======== the card ======== -->
  <rect class="card" x="334" y="92" width="674" height="128" rx="14"/>
  <text class="ink" x="358" y="120" font-size="15" font-weight="700">The model marks the block failed — and hands the decision over</text>
  <text class="ink2" x="358" y="146" font-size="12" font-style="italic">“6 of 8 interviewees already had a workaround, and none of them would pay for a standalone unit…”</text>
  <text class="ink3" x="358" y="174" font-size="12.5">This is a critical block, so the venture cannot reach launch until you decide. The model</text>
  <text class="ink3" x="358" y="192" font-size="12.5">recommends killing it. That is deliberately not its call to make.</text>
  <rect class="fo" x="358" y="200" width="626" height="0" rx="0"/>
  <text class="dk" x="358" y="210" font-size="11.5" font-weight="600">No default is pre-selected. The reasoning is shown either way, so the choice is informed.</text>

  <!-- ======== two exits ======== -->
  <path class="std" d="M671 224 V254" fill="none" stroke-width="1.8"/>
  <path class="std" d="M671 254 H204" fill="none" stroke-width="1.8"/>
  <path class="std" d="M671 254 H836" fill="none" stroke-width="1.8" marker-end="url(#dd)"/>
  <path class="st" d="M204 254 V266" fill="none" stroke-width="1.8" marker-end="url(#ds)"/>

  <!-- kill -->
  <rect class="pnl" x="32" y="272" width="344" height="120" rx="12"/>
  <rect class="fd" x="32" y="272" width="5" height="120" rx="2.5"/>
  <text class="dk caps" x="52" y="296">EXIT A · KILL</text>
  <rect class="p1" x="52" y="308" width="150" height="32" rx="8"/>
  <text class="dk" x="127" y="329" text-anchor="middle" font-size="12.5" font-weight="700">Kill this venture</text>
  <text class="ink3" x="52" y="360" font-size="11.5">The venture is marked killed and stops.</text>
  <text class="ink3" x="52" y="376" font-size="11.5">The idea returns to your candidate list,</text>
  <text class="ink3" x="52" y="390" font-size="11.5">so a different angle stays possible.</text>

  <!-- pivot -->
  <rect class="pnl" x="396" y="272" width="612" height="120" rx="12"/>
  <rect class="f2" x="396" y="272" width="5" height="120" rx="2.5"/>
  <text class="t2 caps" x="416" y="296">EXIT B · PIVOT</text>
  <text class="ink2" x="416" y="318" font-size="12">Or pivot — what changes? <tspan class="ink3">this becomes the new hypothesis</tspan></text>
  <rect class="pnl2" x="416" y="326" width="470" height="34" rx="8"/>
  <text class="sk" x="428" y="343" font-size="11.5"/>
  <rect class="sk" x="428" y="350" width="300" height="4" rx="2"/>
  <rect class="p1" x="896" y="326" width="96" height="32" rx="8"/>
  <text class="t2" x="944" y="347" text-anchor="middle" font-size="12.5" font-weight="700">Pivot instead</text>
  <text class="ink3" x="416" y="380" font-size="11.5">4 of 9 blocks are validated and carry over to the new venture — the count is shown before you commit.</text>

  <!-- ======== what a pivot creates ======== -->
  <path class="st2" d="M702 396 V426" fill="none" stroke-width="1.8" marker-end="url(#d2)"/>
  <text class="t2" x="714" y="418" font-size="11.5" font-weight="600">a new idea card and a sibling venture</text>

  <rect class="pnl" x="396" y="432" width="612" height="150" rx="12"/>
  <text class="mute caps" x="416" y="454">THE NEW CANVAS</text>

  <!-- carried vs fresh -->
  <rect class="f3" x="416" y="464" width="176" height="104" rx="10"/>
  <text class="ok" x="430" y="484" font-size="11.5" font-weight="700">CARRIED OVER</text>
  <text class="ink3" x="430" y="504" font-size="11">blocks that were passed:</text>
  <text class="ink3" x="430" y="521" font-size="11">evidence · hypothesis</text>
  <text class="ink3" x="430" y="536" font-size="11">note · run count · date</text>
  <text class="ink2" x="430" y="558" font-size="11" font-weight="600">still proved. still counted.</text>

  <rect class="p1" x="604" y="464" width="176" height="104" rx="10"/>
  <text class="ink2" x="618" y="484" font-size="11.5" font-weight="700">STARTED FRESH</text>
  <text class="ink3" x="618" y="504" font-size="11">blocks that were pending,</text>
  <text class="ink3" x="618" y="521" font-size="11">iterating or failed —</text>
  <text class="ink3" x="618" y="536" font-size="11">back to pending, zero runs</text>
  <text class="ink2" x="618" y="558" font-size="11" font-weight="600">including the failed one.</text>

  <rect class="f2" x="792" y="464" width="200" height="104" rx="10"/>
  <text class="t2" x="806" y="484" font-size="11.5" font-weight="700">THE OLD ONE STAYS</text>
  <text class="ink3" x="806" y="504" font-size="11">marked “pivoted”, with a link</text>
  <text class="ink3" x="806" y="521" font-size="11">to its child. The history is</text>
  <text class="ink3" x="806" y="536" font-size="11">legible, not overwritten.</text>
  <text class="ink2" x="806" y="558" font-size="11" font-weight="600">one live branch per idea</text>

  <!-- left column note -->
  <rect class="pnl2" x="32" y="432" width="344" height="150" rx="12"/>
  <text class="mute caps" x="52" y="454">WHY CARRY THE EVIDENCE</text>
  <text class="ink3" x="52" y="478" font-size="11.5">A pivot changes your hypothesis</text>
  <text class="ink3" x="52" y="494" font-size="11.5">about <tspan class="ink2">one</tspan> block. The eight you proved around it are still</text>
  <text class="ink3" x="52" y="510" font-size="11.5">proved.</text>
  <text class="ink3" x="52" y="534" font-size="11.5">Re-testing them would throw away</text>
  <text class="ink3" x="52" y="550" font-size="11.5">real work, and spend dozens of AI</text>
  <text class="ink3" x="52" y="566" font-size="11.5">calls relearning it.</text>

  <!-- footer -->
  <text class="ink3" x="32" y="606" font-size="11.5">The same helper backs both routes: a model “pivot” verdict, and your own choice on this card.</text>
</svg>