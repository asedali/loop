<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 900" width="940" height="900" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">
  <title id="t">Phase 1: user, system and model interactions</title>
  <desc id="d">A sequence diagram with three lanes: the user, the app, and the model provider. The user pastes research material. The app checks the length and the monthly quota, wraps the paste as untrusted data, and calls the model. The model returns three to six idea cards. The app validates every field against an allowlist, writes one idea row per card, and redirects to the ideas page. The user selects a card; the app marks it selected, creates a venture and seeds nine canvas blocks, then sends the user to the venture page.</desc>
  <style>
    .bg{fill:#ffffff}
    .hd{fill:#f5f8fc;stroke:#dde3ee;stroke-width:1}
    .msg{fill:#ffffff;stroke:#dde3ee;stroke-width:1}
    .ms1{fill:#f0f9ff;stroke:#0284c7;stroke-width:1.2}
    .ms2{fill:#f6f2ff;stroke:#7c3aed;stroke-width:1.2}
    .msd{fill:#fff1f3;stroke:#e11d48;stroke-width:1.2}
    .msf{fill:#f6f8fb;stroke:#dde3ee;stroke-width:1;stroke-dasharray:4 3}
    .lane{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:5 5}
    .ink{fill:#101827}.ink2{fill:#3b475a}.ink3{fill:#67748a}
    .on-white{fill:#ffffff}
    .t1{fill:#0284c7}.t2{fill:#7c3aed}.dk{fill:#e11d48}
    .a1{stroke:#0284c7}.a2{stroke:#7c3aed}.am{stroke:#94a3b8}.ad{stroke:#e11d48}
    .mk1{fill:#0284c7}.mk2{fill:#7c3aed}.mkm{fill:#94a3b8}.mkd{fill:#e11d48}
    .caps{letter-spacing:.09em;font-size:10.5px;font-weight:700}
    .mk{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#080a0f}
      .hd{fill:#10141c;stroke:#232b3a}
      .msg{fill:#161b25;stroke:#232b3a}
      .ms1{fill:#0d1a26;stroke:#38bdf8}
      .ms2{fill:#151129;stroke:#a78bfa}
      .msd{fill:#1c1119;stroke:#fb7185}
      .msf{fill:#10141c;stroke:#232b3a}
      .lane{stroke:#2b3648}
      .ink{fill:#eef2f9}.ink2{fill:#c2cbd9}.ink3{fill:#8593a8}
      .on-white{fill:#0a0d13}
      .t1{fill:#38bdf8}.t2{fill:#a78bfa}.dk{fill:#fb7185}
      .a1{stroke:#38bdf8}.a2{stroke:#a78bfa}.am{stroke:#64748b}.ad{stroke:#fb7185}
      .mk1{fill:#38bdf8}.mk2{fill:#a78bfa}.mkm{fill:#64748b}.mkd{fill:#fb7185}
    }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk1" d="M0 .6 L7.4 4 L0 7.4 z"/></marker>
    <marker id="m2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk2" d="M0 .6 L7.4 4 L0 7.4 z"/></marker>
    <marker id="mm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkm" d="M0 .6 L7.4 4 L0 7.4 z"/></marker>
    <marker id="md" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkd" d="M0 .6 L7.4 4 L0 7.4 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="940" height="900"/>

  <text class="ink" x="32" y="40" font-size="21" font-weight="700">Phase 1 — what actually happens when you paste</text>
  <text class="ink3" x="32" y="62" font-size="13">Two requests, one AI call. Everything else is validation, storage and routing.</text>

  <!-- lanes -->
  <path class="lane" d="M170 128 V856"/>
  <path class="lane" d="M470 128 V856"/>
  <path class="lane" d="M770 128 V856"/>

  <g>
    <rect class="hd" x="82" y="92" width="176" height="36" rx="10"/>
    <text class="ink" x="170" y="115" text-anchor="middle" font-size="14" font-weight="700">You</text>
  </g>
  <g>
    <rect class="hd" x="382" y="92" width="176" height="36" rx="10"/>
    <text class="ink" x="470" y="115" text-anchor="middle" font-size="14" font-weight="700">The app</text>
  </g>
  <g>
    <rect class="hd" x="682" y="92" width="176" height="36" rx="10"/>
    <text class="ink" x="770" y="115" text-anchor="middle" font-size="14" font-weight="700">The model</text>
  </g>

  <!-- 1 -->
  <path class="a1" d="M176 176 H364" fill="none" stroke-width="1.8" marker-end="url(#m1)"/>
  <text class="ink" x="270" y="166" text-anchor="middle" font-size="13" font-weight="600">paste your material</text>
  <text class="ink3" x="270" y="196" text-anchor="middle" font-size="11.5">one textarea — no upload, no URL import</text>

  <!-- 2 self -->
  <g>
    <rect class="msf" x="330" y="214" width="280" height="46" rx="10"/>
    <text class="ink2" x="346" y="234" font-size="12.5" font-weight="600">refuse under 40 characters</text>
    <text class="ink3" x="346" y="251" font-size="11.5">nothing to cluster; a wasted call is real money</text>
  </g>
  <path class="am" d="M470 200 V210" fill="none" stroke-width="1.4" marker-end="url(#mm)"/>

  <!-- 3 -->
  <g>
    <rect class="msf" x="330" y="278" width="280" height="46" rx="10"/>
    <text class="ink2" x="346" y="298" font-size="12.5" font-weight="600">check the monthly quota</text>
    <text class="ink3" x="346" y="315" font-size="11.5">refused before any money is spent</text>
  </g>
  <path class="am" d="M470 260 V274" fill="none" stroke-width="1.4" marker-end="url(#mm)"/>

  <!-- 4 -->
  <path class="a2" d="M476 342 H664" fill="none" stroke-width="1.8" marker-end="url(#m2)"/>
  <text class="t2" x="570" y="332" text-anchor="middle" font-size="13" font-weight="600">one prompt</text>
  <text class="ink3" x="570" y="362" text-anchor="middle" font-size="11.5">paste wrapped in delimiters, labelled untrusted data</text>
  <text class="ink3" x="570" y="378" text-anchor="middle" font-size="11.5">+ instruction to ignore anything that looks like a command</text>

  <!-- 5 -->
  <path class="a2" d="M764 412 H576" fill="none" stroke-width="1.8" marker-end="url(#m2)"/>
  <text class="t2" x="670" y="402" text-anchor="middle" font-size="13" font-weight="600">3–6 cards</text>
  <text class="ink3" x="670" y="432" text-anchor="middle" font-size="11.5">title · commercial framing · strength signal · raw claims</text>
  <path class="am" d="M770 390 V404" fill="none" stroke-width="1.4" marker-end="url(#mm)"/>

  <!-- 6 -->
  <g>
    <rect class="msf" x="330" y="456" width="280" height="62" rx="10"/>
    <text class="ink2" x="346" y="476" font-size="12.5" font-weight="600">validate every field</text>
    <text class="ink3" x="346" y="493" font-size="11.5">no title → drop the card</text>
    <text class="ink3" x="346" y="509" font-size="11.5">invented signal → falls back to “early”</text>
  </g>
  <path class="am" d="M470 440 V452" fill="none" stroke-width="1.4" marker-end="url(#mm)"/>

  <!-- 7 -->
  <g>
    <rect class="msf" x="330" y="536" width="280" height="46" rx="10"/>
    <text class="ink2" x="346" y="556" font-size="12.5" font-weight="600">write one idea row per card</text>
    <text class="ink3" x="346" y="573" font-size="11.5">status = candidate</text>
  </g>
  <path class="am" d="M470 518 V532" fill="none" stroke-width="1.4" marker-end="url(#mm)"/>

  <!-- 8 -->
  <path class="a1" d="M464 614 H276" fill="none" stroke-width="1.8" marker-end="url(#m1)"/>
  <text class="ink" x="370" y="604" text-anchor="middle" font-size="13" font-weight="600">redirect to the idea cards</text>
  <text class="ink3" x="370" y="634" text-anchor="middle" font-size="11.5">a refresh must never re-run the extraction</text>

  <!-- 9 user clicks -->
  <path class="a1" d="M176 686 H364" fill="none" stroke-width="1.8" marker-end="url(#m1)"/>
  <text class="ink" x="270" y="676" text-anchor="middle" font-size="13" font-weight="600">select one card</text>
  <path class="am" d="M170 650 V678" fill="none" stroke-width="1.4" marker-end="url(#mm)"/>

  <!-- 10 -->
  <g>
    <rect class="msf" x="330" y="706" width="280" height="80" rx="10"/>
    <text class="ink2" x="346" y="726" font-size="12.5" font-weight="600">create the venture</text>
    <text class="ink3" x="346" y="743" font-size="11.5">mark the idea selected</text>
    <text class="ink3" x="346" y="759" font-size="11.5">seed nine canvas blocks, all pending</text>
    <text class="ink3" x="346" y="775" font-size="11.5">nothing to backfill later</text>
  </g>
  <path class="am" d="M470 690 V702" fill="none" stroke-width="1.4" marker-end="url(#mm)"/>

  <!-- 11 -->
  <path class="a1" d="M464 826 H276" fill="none" stroke-width="1.8" marker-end="url(#m1)"/>
  <text class="ink" x="370" y="816" text-anchor="middle" font-size="13" font-weight="600">the Phase 2 board is already there</text>

  <!-- quota footnote -->
  <g>
    <rect class="msd" x="700" y="540" width="208" height="112" rx="10"/>
    <text class="dk" x="716" y="562" font-size="12" font-weight="700">Quota, honestly</text>
    <text class="ink3" x="716" y="581" font-size="11.5">Failed calls are logged</text>
    <text class="ink3" x="716" y="596" font-size="11.5">too, so they still count.</text>
    <text class="ink3" x="716" y="614" font-size="11.5">An unowned venture id is</text>
    <text class="ink3" x="716" y="629" font-size="11.5">rejected before the model is</text>
    <text class="ink3" x="716" y="644" font-size="11.5">reached — nobody spends</text>
    <text class="ink3" x="716" y="659" font-size="11.5">anyone else's quota.</text>
  </g>
</svg>